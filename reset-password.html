    <script>
        function handleReset(e) {
            e.preventDefault();
            const emailInput = document.getElementById('resetEmail');
            const userEmail = (emailInput.value || '').trim();
            if (!userEmail) {
                alert('Please enter your email.');
                emailInput.focus();
                return;
            }
            // Note: The sender (From) is controlled by the user's email client.
            const to = 'info@lerno.com';
            const subject = encodeURIComponent('Reset Password Request');
            const bodyMessage = `Hello Lerno Team,\n\nI would like to request a password reset.\n\nMy account email: ${userEmail}\n\nPlease send me instructions to change my password.\n\nThank you!\n`;
            const body = encodeURIComponent(bodyMessage);
            const mailtoUrl = `mailto:${to}?subject=${subject}&body=${body}`;
            window.location.href = mailtoUrl;
        }
    </script>
